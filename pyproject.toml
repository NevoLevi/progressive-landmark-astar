[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "progressive-landmarks-artifact"
version = "0.1.0"
description = "Reproducible experiments for progressive differential-landmark evaluation in optimal A*"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
analysis = [
    "matplotlib>=3.10,<4",
]

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["progressive_landmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["src/python"]
